<app-auth-layout title="Sign In" subtitle="Welcome back. Grab the popcorn.">
  @if (errorMessage(); as message) {
    <div role="alert" class="mb-6 rounded-md bg-amber-600/90 px-4 py-3 text-sm text-white">
      {{ message }}
    </div>
  }
  @if (infoMessage(); as message) {
    <div role="status" class="mb-6 rounded-md bg-neutral-700/90 px-4 py-3 text-sm text-white">
      {{ message }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
    <!-- Email -->
    <div>
      <label for="email" class="sr-only">Email address</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="Email address"
        class="auth-input"
        [class.auth-input-error]="fieldError('email')"
        [attr.aria-invalid]="!!fieldError('email')"
        aria-describedby="email-error"
      />
      @if (fieldError('email'); as error) {
        <p id="email-error" class="field-error">{{ error }}</p>
      }
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="sr-only">Password</label>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Password"
          class="auth-input pr-16"
          [class.auth-input-error]="fieldError('password')"
          [attr.aria-invalid]="!!fieldError('password')"
          aria-describedby="password-error"
        />
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute inset-y-0 right-0 px-4 text-xs font-semibold uppercase tracking-wide text-neutral-400 transition-colors hover:text-white"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (fieldError('password'); as error) {
        <p id="password-error" class="field-error">{{ error }}</p>
      }
    </div>

    <button type="submit" class="btn-primary mt-6" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="spinner" aria-hidden="true"></span> Signing in…
      } @else {
        Sign In
      }
    </button>

    <div class="flex items-center justify-between text-sm text-neutral-400">
      <label class="flex cursor-pointer select-none items-center gap-2">
        <input type="checkbox" formControlName="rememberMe" class="auth-checkbox" />
        Remember me
      </label>
      <a href="#" (click)="$event.preventDefault()" class="hover:underline">Need help?</a>
    </div>
  </form>

  <!-- Social login -->
  <div class="my-8 flex items-center gap-4 text-xs uppercase tracking-widest text-neutral-500">
    <span class="h-px flex-1 bg-neutral-700"></span>
    or
    <span class="h-px flex-1 bg-neutral-700"></span>
  </div>

  <div class="grid gap-3 sm:grid-cols-2">
    <button type="button" class="btn-social" (click)="socialLogin('Google')">
      <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.3 14.6 2.3 12 2.3 6.6 2.3 2.3 6.6 2.3 12S6.6 21.7 12 21.7c5.6 0 9.3-3.9 9.3-9.5 0-.6-.1-1.1-.2-1.6H12z"/>
      </svg>
      Google
    </button>
    <button type="button" class="btn-social" (click)="socialLogin('Apple')">
      <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.7 1.3-2.7s-2.4-1-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/>
      </svg>
      Apple
    </button>
  </div>

  <p class="mt-10 text-neutral-400">
    New to AZMFLIX?
    <a routerLink="/register" class="font-medium text-white hover:underline">Sign up now.</a>
  </p>
</app-auth-layout>
